{% extends "base.html" %}
{% block title %}Homepage{% endblock %}
{% block content %}
    <h1>Welcome!</h1>
    <p>Hello World!</p>
    <p>Testo personalizzato: <em>{{ testo }}</em></p>
    {% if user.is_authenticated %}
        <p>Ciao {{ user.username }}</p>
    {% endif %}
    {% if user.is_anonymous %}
        <p>Ciao utente sconosciuto</p>
    {% endif %}
{% endblock %}
