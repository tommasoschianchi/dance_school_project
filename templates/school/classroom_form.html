{% extends "base.html" %}
{%load crispy_forms_tags %}
{% block title %}{% if object %}Modifica classe{% else %}Nuova classe{% endif %}{% endblock %}
{% block content %}
{% if object %}<h1>Modifica classe</h1>{% else %}<h1>Crea una nuova classe</h1>{% endif %}
<form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit">{% if object %}Salva{% else %}Crea{% endif %}</button>
</form>
{% endblock %}
