{% extends "base.html" %}
{% block title %}Classi{% endblock %}
{% block content %}
<table>
    <tr><th>nome</th><th>capacità</th><th></th><th></th><th></th></tr>
    {% for el in object_list %}
    <tr>
        <td>{{ el.name }}</td>
        <td>{{ el.capacity }}</td>
        <td><a href="{% url 'classroom_detail' el.id %}">Dettagli</a></td>
        <td><a href="{% url 'classroom_update' el.id %}">Modifica</a></td>
        <td><a href="{% url 'classroom_delete' el.id %}">Elimina</a></td>
    </tr>
    {% empty %}
    <tr><td colspan="5">Nessuna classe inserita</td></tr>
    {% endfor %}
</table>
<a href="{% url 'classroom_create' %}">Crea nuova classe</a>
{% endblock %}
