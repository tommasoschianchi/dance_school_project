{% extends "base.html" %}
{%load crispy_forms_tags %}
{% block title %}{% if object %}Modifica corso{% else %}Nuovo corso{% endif %}{% endblock %}
{% block content %}
{% if object %}<h1>Modifica corso</h1>{% else %}<h1>Crea un nuovo corso</h1>{% endif %}
<form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit">{% if object %}Salva{% else %}Crea{% endif %}</button>
</form>
{% endblock %}
